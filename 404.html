<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <title>Page Not Found &mdash; Mohamed Khalil Boutar</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css?v=10">
</head>

<body>
    <main>
        <section class="section-tint">
            <div class="container-app flex flex-col items-center justify-center text-center" style="min-height:100vh; padding-block:5rem">
                <p class="section-eyebrow mb-2">Error 404</p>
                <h1 class="font-bold text-accent text-7xl">404</h1>
                <h2 class="mt-4 text-3xl">Page not found</h2>
                <p class="mt-3 max-w-md mx-auto text-muted">
                    The page you're looking for doesn't exist or may have been moved.
                </p>
                <div class="mt-8 flex flex-wrap items-center justify-center gap-4">
                    <a href="/en/" class="btn-primary">English site</a>
                    <a href="/fr/" class="btn-secondary">Site en français</a>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
